<style>
  /* Concepto: libreta de dietista sobre un plato dividido en tres. Verde hoja de fondo, un solo acento violeta. */
  :root {
    --bg: #F1F6F1; --surface: #FFFFFF; --surface2: #E5EEE6; --ink: #13241A; --muted: #55705C; --line: #D1DFD3;
    --accent: #5B3FD6; --on-accent: #FFFFFF; --accent-soft: #E9E4FB;
    --carb: #E9A21C; --prot: #E0533F; --fat: #2D93D1; --fib: #38A169;
    --good: #2E9E5B; --good-bg: #DDF2E5; --good-ink: #17653A;
    --warn: #C98A0B; --warn-bg: #FFF1CF; --warn-ink: #7A5200;
    --bad: #CF3F38; --bad-bg: #FBE0DD; --bad-ink: #8E1F1A;
    --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
    --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1712; --surface: #16241B; --surface2: #1E3025; --ink: #E6F1E9; --muted: #93AA9A; --line: #29402F;
      --accent: #A794FF; --on-accent: #1B1240; --accent-soft: #2A2350;
      --carb: #F2B544; --prot: #F07B68; --fat: #5BB5EA; --fib: #5CC48B;
      --good: #4CC27F; --good-bg: #173B27; --good-ink: #8AE0AE;
      --warn: #E6B33C; --warn-bg: #3C3010; --warn-ink: #F2D27A;
      --bad: #F0736D; --bad-bg: #40201E; --bad-ink: #FFB1AC;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1712; --surface: #16241B; --surface2: #1E3025; --ink: #E6F1E9; --muted: #93AA9A; --line: #29402F;
    --accent: #A794FF; --on-accent: #1B1240; --accent-soft: #2A2350;
    --carb: #F2B544; --prot: #F07B68; --fat: #5BB5EA; --fib: #5CC48B;
    --good: #4CC27F; --good-bg: #173B27; --good-ink: #8AE0AE;
    --warn: #E6B33C; --warn-bg: #3C3010; --warn-ink: #F2D27A;
    --bad: #F0736D; --bad-bg: #40201E; --bad-ink: #FFB1AC;
    color-scheme: dark;
  }
  body { background: var(--bg); color: var(--ink); }
</style>
<style>html{color-scheme:light dark}body{margin:0;font:14px system-ui,sans-serif}</style>
<style>
/* Plato Vivo · estilos. Los colores (tokens) están en index.html. */
*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  font-family: var(--f-body); font-size: 15px; line-height: 1.45; color: var(--ink); background: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 0; -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; font-family: var(--f-display); letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0; }
.wrap { max-width: 760px; margin: 0 auto; padding-bottom: 150px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap-r { flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.end { margin-left: auto; }
.sec { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
.sec-title { font-size: 18px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; }
.sec-title small { font-family: var(--f-body); font-size: 13px; font-weight: 500; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }

/* cabecera */
.top { display: flex; align-items: center; gap: 12px; padding: 10px 0 4px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -0.02em; }
.brand svg { width: 28px; height: 28px; }
.datenav { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.datenav button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 34px; height: 34px; display: grid; place-items: center; }
.datenav .d { font-weight: 600; min-width: 92px; text-align: center; font-size: 14px; text-transform: capitalize; }
.top::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }

/* tarjetas */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.card.flat { background: var(--surface2); border-color: transparent; }
.card h3 { font-size: 16px; font-weight: 700; }
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; }

/* chips y botones */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 13px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip small { opacity: .75; font-weight: 500; margin-left: 4px; }
.seg { display: flex; background: var(--surface2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 11px 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--bad-ink); border-color: var(--bad); background: var(--bad-bg); }
.btn.sm { padding: 7px 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; width: 36px; height: 36px; display: grid; place-items: center; font-size: 18px; line-height: 1; }

/* formularios */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.lab { font-size: 13px; font-weight: 600; color: var(--muted); }
.in { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 16px; }
.in:focus { border-color: var(--accent); }
textarea.in { min-height: 76px; resize: vertical; }
.check { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.check:last-child { border-bottom: 0; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }

/* avisos */
.banner { border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; border: 1px solid transparent; }

        desayuno: 'Buenos días. ¿Ya has desayunado? Apúntalo en Plato Vivo.',
        comida: 'Hora de comer: media plato de verdura, un cuarto de proteína y otro de almidón.',

<script>
/* Plato Vivo · pantallas Alimentos, Detective, Plan (menús, recetas, gustos, programa) y Yo, más el arranque. */
(function (G) {

  const LVL = { 1: 'b', 2: 'r', 3: 'm' };

     ALIMENTOS
     ===================================================================== */
  U.fs = { q: '', sort: 'az', cat: '', gl: '', gut: '', apto: false };

  const foodCard = f => {

  };
  U.VIEWS.alimentos = () => {

      Object.entries(SORTS).map(([k, v]) => '<option value="' + k + '"' + (F.sort === k ? ' selected' : '') + '>' + v[0] + '</option>').join('') + '</select></div>' +

  const detRow = (name, o, kind) => '<div class="li" style="cursor:default"><span class="li-main"><span class="li-title">' + name + '</span><span class="li-sub">En ' + o.n + ' ' + (o.n === 1 ? 'registro' : 'registros') + ' · confianza ' + o.conf + '</span></span>' +

  U.VIEWS.detective = () => {

        d.suspects.map(o => detRow(esc((getFood(o.k) || { e: '', n: o.k }).e + ' ' + (getFood(o.k) || { n: o.k }).n), o, 'bad')).join('') + '</div>' : '<div class="card"><h3>Sin sospechosos claros</h3><p class="small muted">Ningún alimento destaca todavía. Sigue anotando.</p></div>') +
        (g.length ? '<div class="card"><h3>Grupos fermentables</h3>' + g.map(o => detRow(esc(grp(o.k)), o, 'bad')).join('') + '</div>' : '') +
        (d.allies.length ? '<div class="card"><h3>Aliados</h3><p class="small muted" style="margin:4px 0 8px">Los que casi nunca preceden a una molestia.</p>' + d.allies.map(o => detRow(esc((getFood(o.k) || { e: '', n: o.k }).e + ' ' + (getFood(o.k) || { n: o.k }).n), o, 'good')).join('') + '</div>' : '') +
        '<p class="small muted">Es una correlación, no un diagnóstico: que dos cosas coincidan no prueba que una cause la otra. Contrástalo con tu médico.</p>';

    return sec('<div class="sec-title">Detective digestivo <small>' + d.checks + ' registros</small></div>' +
      '<div class="card"><h3>¿Cómo te sientes ahora?</h3><div class="row" style="margin-top:10px"><button class="chip grow" data-act="feel" data-lvl="1">Bien</button><button class="chip grow" data-act="feel" data-lvl="2">Regular</button><button class="chip grow" data-act="feel" data-lvl="3">Mal</button></div>' +

      reintroHTML() +
      (demo ? '<div class="banner info"><div class="grow"><b>Estás viendo datos de ejemplo</b><p class="small">Se mezclan con los tuyos hasta que los borres.</p></div><button class="btn sm" data-act="democlear">Quitar ejemplo</button></div>' : '') +

  /* ---------- Programa de pérdida de peso ---------- */

  function viewProg() {

      GATES.map((g, i) => '<label class="check"><input type="checkbox" data-bind="gate" data-i="' + i + '"' + (U.pl.gates[i] ? ' checked' : '') + '><span>' + esc(g) + '</span></label>').join('') + '</div>' +

  function progressHTML() {
    const s = S(), n = U.me.range, t = PV.targets(s), days = Array.from({ length: n }, (_, i) => addDays(today(), i - n + 1));
    const logged = days.filter(k => PV.dayOf(s, k).items.length), tots = logged.map(k => PV.dayTotals(s, k));
    const avg = f => tots.length ? tots.reduce((a, b) => a + b[f], 0) / tots.length : 0;
    const over = tots.filter(x => x.kcal > t.kcal * 1.05).length;
    const bad = new Set(s.feelings.filter(x => x.lvl === 3 && x.ts.slice(0, 10) >= days[0]).map(x => x.ts.slice(0, 10))).size;
    const ws = PV.sortedWeights(s).filter(w => w.d >= addDays(days[0], -7)), dw = ws.length >= 2 ? ws[ws.length - 1].kg - ws[0].kg : null;
    const water = days.reduce((a, k) => a + (PV.dayOf(s, k).water || 0), 0) / n;
    const mx = Math.max(t.kcal * 1.3, ...days.map(k => PV.dayTotals(s, k).kcal));
    const bars = days.map(k => { const v = PV.dayTotals(s, k).kcal; return '<i style="flex:1;min-width:2px;height:' + clamp(v / mx * 100, v ? 4 : 1, 100).toFixed(0) + '%;background:' + (v > t.kcal * 1.05 ? 'var(--bad)' : v ? 'var(--good)' : 'var(--line)') + ';border-radius:3px"></i>'; }).join('');
    return '<div class="card stack"><div class="row"><h3 class="grow">Tu progreso</h3><div class="seg" style="width:150px">' + [7, 30].map(r => '<button class="' + (n === r ? 'on' : '') + '" data-act="prange" data-v="' + r + '">' + r + ' días</button>').join('') + '</div></div>' +
      (logged.length ? '<div style="display:flex;align-items:flex-end;gap:' + (n > 7 ? 2 : 6) + 'px;height:80px" role="img" aria-label="Calorías por día">' + bars + '</div>' +
        '<div class="grid2"><div class="stat"><span class="l">Media diaria</span><b class="big-n">' + fmt(avg('kcal')) + '</b><span class="small muted">kcal · objetivo ' + fmt(t.kcal) + '</span></div><div class="stat"><span class="l">Proteína media</span><b class="big-n">' + fmt(avg('p')) + '</b><span class="small muted">g · objetivo ' + fmt(t.p) + '</span></div>' +
        '<div class="stat"><span class="l">Días pasados de kcal</span><b class="big-n">' + over + '</b><span class="small muted">de ' + logged.length + ' registrados</span></div><div class="stat"><span class="l">Días con malestar</span><b class="big-n">' + bad + '</b><span class="small muted">agua media ' + fmt(water, 1) + ' vasos</span></div></div>' +
        (dw != null ? '<p class="small">Peso: ' + (dw <= 0 ? 'has bajado ' : 'has subido ') + fmt(Math.abs(dw), 1) + ' kg en este periodo.</p>' : '') : '<p class="small muted">Aún no hay registros en estos días. Cuando anotes comidas verás aquí tu evolución.</p>') + '<button class="btn" data-act="weekopen">Resumen de la semana</button></div>';
  }

  function weightChart() {
    const s = S(), ws = PV.sortedWeights(s); if (ws.length < 2) return '<p class="small muted">Con dos pesos o más verás aquí tu evolución.</p>';
    const W = 340, Hh = 180, pl = 34, pr = 10, pt = 10, pb = 22, p = s.program, g = s.profile.goalWeight;
    const first = ws[0].d, last = ws[ws.length - 1].d, span = Math.max(1, PV.daysBetween(first, last));
    const vals = ws.map(x => x.kg).concat(g > 0 ? [g] : [], p ? [p.goalKg] : []);
    const lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 1);
    const X = d => pl + (PV.daysBetween(first, d) / span) * (W - pl - pr), Y = k => pt + (1 - (k - lo) / (hi - lo)) * (Hh - pt - pb);
    const ma = PV.movingAvg(ws), path = ma.map((m, n) => (n ? 'L' : 'M') + X(m.d).toFixed(1) + ' ' + Y(m.kg).toFixed(1)).join('');
    const ticks = [lo, (lo + hi) / 2, hi].map(v => '<line class="grid" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '"/><text class="ax" x="' + (pl - 6) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end">' + fmt(v, 0) + '</text>').join('');
    const goalLine = g > 0 && g >= lo && g <= hi ? '<line class="goal" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(g).toFixed(1) + '" y2="' + Y(g).toFixed(1) + '"/>' : '';
    const pts = ws.map(x => '<circle class="pt" r="3" cx="' + X(x.d).toFixed(1) + '" cy="' + Y(x.kg).toFixed(1) + '"/>').join('');
    const prog = p && p.start >= first && p.start <= last ? '<path class="prog" d="M' + X(p.start).toFixed(1) + ' ' + Y(p.startKg).toFixed(1) + 'L' + X(last).toFixed(1) + ' ' + Y(Math.max(p.goalKg, p.startKg - p.rate * (PV.daysBetween(p.start, last) / 7))).toFixed(1) + '"/>' : '';
    const tr = PV.trend(ws), tx = tr ? '<p class="small muted">Ritmo reciente: ' + (tr.perWeek <= 0 ? 'bajas ' : 'subes ') + fmt(Math.abs(tr.perWeek), 2) + ' kg por semana.</p>' : '';
    return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + Hh + '" role="img" aria-label="Evolución del peso">' + ticks + goalLine + prog + pts + '<path class="ma" d="' + path + '"/>' +
      '<text class="ax" x="' + pl + '" y="' + (Hh - 4) + '">' + esc(PV.fmtDate(first)) + '</text><text class="ax" x="' + (W - pr) + '" y="' + (Hh - 4) + '" text-anchor="end">' + esc(PV.fmtDate(last)) + '</text></svg></div>' +
      '<p class="small muted">Línea gruesa: media de 7 días' + (g > 0 ? ' · verde: tu meta' : '') + '.</p>' + tx;
  }

      '<label class="check"><input type="checkbox" data-bind="setremind"' + (s.settings.remind ? ' checked' : '') + '><span>Recordarme registrar el desayuno, la comida y la cena</span></label>' +
      '' + (!(U.native && U.native()) && G.Notification && G.Notification.permission === 'default' ? '<button class="btn" data-act="notifon">Activar avisos del navegador</button>' : '') + '<p class="small muted">Los avisos aparecen mientras la app está abierta. Con la app cerrada, el navegador no me deja enviar notificaciones desde aquí: se pueden activar como tareas programadas de Claude.</p></div>' +
      '<div class="card stack"><h3>Tus datos</h3><p class="small muted">' + (st === 'cloud' ? 'Guardados en tu cuenta y en este dispositivo.' : 'Guardados solo en este dispositivo.') + '</p><div class="row"><button class="btn grow" data-act="export">Exportar copia</button><button class="btn grow" data-act="import">Importar copia</button></div><div class="row">' +
      (PV.demoOn(s) ? '<button class="btn grow" data-act="democlear">Quitar ejemplo</button>' : '<button class="btn grow" data-act="demoadd">Cargar ejemplo</button>') + '</div>' +
      (U.me.confirm ? '<div class="banner bad" style="margin:0"><div class="grow"><b>¿Borrar todo?</b><p class="small">Se eliminan perfil, diario, pesos y gustos. No se puede deshacer.</p></div><button class="btn danger sm" data-act="wipe">Borrar</button><button class="btn sm" data-act="wipeno">No</button></div>' : '<button class="btn danger" data-act="wipeask">Borrar todos mis datos</button>') + '</div>' +
      '<p class="small muted">Plato Vivo es una ayuda informativa creada con IA. No sustituye a un médico ni a un dietista-nutricionista; ante síntomas persistentes, consulta con un profesional.</p>', true);
  };
  const refreshMetrics = () => { const m = $('#metrics'); if (m) m.innerHTML = metricsHTML(); };
  B.pf = el => { const k = el.dataset.k, v = parseFloat(el.value) || 0; PV.Store.mutate(s => { s.profile[k] = k === 'age' || k === 'height' ? Math.round(v) : v; }); refreshMetrics(); };
  B.pfact = el => { PV.Store.mutate(s => { s.profile.activity = +el.value; }); refreshMetrics(); };
  B.pfgoal = el => { PV.Store.mutate(s => { s.profile.goal = el.value; }); refreshMetrics(); };
  B.pfmot = el => { PV.Store.mutate(s => { s.profile.motivo = el.value.slice(0, 120); }); };
  B.wd = el => { U.me.wd = el.value; };
  B.wkg = el => { U.me.wkg = el.value; };
  B.setalerts = el => PV.Store.mutate(s => { s.settings.alerts = el.checked; });
  B.setremind = el => PV.Store.mutate(s => { s.settings.remind = el.checked; });
  A.sex = el => U.commit(s => { s.profile.sex = el.dataset.v; });
  A.restr = el => U.commit(s => {
    const k = el.dataset.k, r = s.profile.restr, i = r.indexOf(k);
    if (i >= 0) r.splice(i, 1); else {
      r.push(k);
      if (k === 'vegano' && !r.includes('vegetariano')) r.push('vegetariano');
    }
  });
  A.wadd = () => {
    const kg = parseFloat(String(U.me.wkg).replace(',', '.')), d = U.me.wd || today();
    if (!(kg >= 20 && kg <= 400)) { U.toast('Escribe un peso entre 20 y 400 kg.', 'warn'); return; }
    U.commit(s => { s.weights = s.weights.filter(w => w.d !== d); s.weights.push({ d, kg: Math.round(kg * 10) / 10 }); });
    U.me.wkg = ''; U.render(); U.toast('Peso guardado.');
  };
  A.wdel = el => U.commit(s => { s.weights = s.weights.filter(w => w.d !== el.dataset.d); });
  A.wipeask = () => { U.me.confirm = true; U.render(); };
  A.wipeno = () => { U.me.confirm = false; U.render(); };
  A.wipe = () => { U.me.confirm = false; U.commit(s => { const f = PV.defaults(); for (const k of Object.keys(s)) delete s[k]; Object.assign(s, f); }); U.toast('Datos borrados.'); };
  A.export = async () => {
    try {
      const dl = await G.claude.use('downloads');
      if (!dl) throw new Error('na');
      await dl.save({ filename: 'plato-vivo-' + today() + '.json', data: PV.exportData() });
    } catch (e) {
      if (e && e.code === 'declined') { U.toast('Exportación cancelada.'); return; }
      try { PV.free.download('plato-vivo-' + today() + '.json', PV.exportData()); } catch (e2) { U.toast('No se puede descargar desde esta vista.', 'warn'); }
    }
  };



  /* ---------- modo cocina ---------- */
  U.cook = { end: 0, int: null, label: '' };
  const mins = t => { const m = /(\d+)(?:\s*[–-]\s*(\d+))?\s*minutos?/i.exec(t); return m ? +(m[2] || m[1]) : 0; };
  A.cook = async () => {
    const sh = U.sheet; U.openSheet('cook', { rid: sh.rid, i: 0, n: sh.n });
    try { if (navigator.wakeLock) U.wake = await navigator.wakeLock.request('screen'); } catch (e) { /* opcional */ }
  };
  function sheetCook() {
    const sh = U.sheet, r = getRecipe(sh.rid), ad = r && PV.adaptRecipe(r, S().profile.restr); if (!r || !ad.ok) return { title: 'Modo cocina', body: '' };
    const n = r.st.length, i = clamp(sh.i, 0, n), k = sh.n / r.s;
    if (i === 0) return { title: esc(r.n), body: '<p class="lab">Antes de empezar, ten a mano</p>' + ad.ing.map(x => { const f = getFood(x.id); return f ? '<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line);font-size:18px"><span>' + esc(f.e) + '</span><span class="grow">' + esc(f.n) + '</span><b class="mono">' + esc(PV.qtyLabel(f, x.g * k)) + '</b></div>' : ''; }).join(''),
      foot: '<button class="btn primary block" data-act="cookgo" data-d="1">Empezar</button>' };
    const st = r.st[i - 1], m = mins(st);
    return { title: 'Paso ' + i + ' de ' + n,
      body: '<div class="progress" style="margin-bottom:16px"><i style="width:' + Math.round(i / n * 100) + '%"></i></div><p style="font-size:24px;line-height:1.35;font-weight:600">' + esc(st) + '</p>' +
        (m ? '<div class="card" style="margin-top:18px;text-align:center"><div class="big-n" id="cookT">' + (U.cook.end > Date.now() ? '' : fmt(m) + ':00') + '</div><button class="btn primary" data-act="cooktimer" data-m="' + m + '">' + (U.cook.end > Date.now() ? 'Reiniciar temporizador' : 'Temporizador de ' + m + ' min') + '</button></div>' : ''),
      foot: '<div class="row"><button class="btn grow" data-act="cookgo" data-d="-1">← Atrás</button><button class="btn primary grow" data-act="cookgo" data-d="1">' + (i === n ? 'Terminar' : 'Siguiente →') + '</button></div>' };
  }
  A.cookgo = el => {
    const sh = U.sheet, r = getRecipe(sh.rid), d = +el.dataset.d, next = sh.i + d;
    if (next > r.st.length) { A.cookend(); return; }
    sh.i = Math.max(0, next); U.renderSheet(); if (U.cook.end > Date.now()) tickCook();
  };
  A.cookend = () => { clearInterval(U.cook.int); U.cook.end = 0; try { if (U.wake) U.wake.release(); } catch (e) { /* nada */ } U.wake = null; U.closeSheet(); U.toast('¡Que aproveche!'); };
  function tickCook() {
    clearInterval(U.cook.int);
    const upd = () => {
      const left = Math.max(0, Math.round((U.cook.end - Date.now()) / 1000)), el = $('#cookT');
      if (el) el.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
      if (!left) { clearInterval(U.cook.int); U.cook.end = 0; U.toast('⏱ Temporizador terminado', 'warn'); try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) { /* nada */ } }
    };
    U.cook.int = setInterval(upd, 500); upd();
  }
  A.cooktimer = el => { U.cook.end = Date.now() + (+el.dataset.m) * 60000; U.renderSheet(); tickCook(); };


  /* ---------- resumen semanal ---------- */
  function weekData() {
    const s = S(), t = PV.targets(s), days = Array.from({ length: 7 }, (_, i) => addDays(today(), i - 6));
    const info = days.map(k => ({ k, tot: PV.dayTotals(s, k), n: PV.dayOf(s, k).items.length, water: PV.dayOf(s, k).water || 0 }));
    const logged = info.filter(x => x.n);
    const avg = f => logged.length ? logged.reduce((a, b) => a + b.tot[f], 0) / logged.length : 0;
    const bad = new Set(s.feelings.filter(x => x.lvl === 3 && x.ts.slice(0, 10) >= days[0]).map(x => x.ts.slice(0, 10))).size;
    const waterOk = info.filter(x => x.water >= t.water).length, inRange = logged.filter(x => x.tot.kcal >= t.kcal * 0.85 && x.tot.kcal <= t.kcal * 1.05).length;
    const best = logged.slice().sort((a, b) => Math.abs(a.tot.kcal - t.kcal) - Math.abs(b.tot.kcal - t.kcal))[0];
    const win = logged.length >= 6 ? 'Registraste ' + logged.length + ' de 7 días: la constancia es lo que más pesa.' : inRange >= 4 ? inRange + ' días dentro de tu objetivo de calorías.' : waterOk >= 4 ? 'Completaste el agua ' + waterOk + ' días.' : bad === 0 && logged.length >= 3 ? 'Una semana sin días malos digestivos.' : logged.length ? 'Has registrado ' + logged.length + ' días. Cada registro cuenta.' : 'Esta semana empieza por apuntar una sola comida al día.';
    const goals = [[logged.length < 5, 'Registra al menos 5 días la próxima semana.'], [avg('p') < t.p * 0.8, 'Sube la proteína: añade una ración en el desayuno.'], [avg('fib') < t.fib * 0.7, 'Suma fibra: una pieza de fruta entera y una ración de verdura extra al día.'], [waterOk < 4, 'Llega a tu objetivo de agua al menos 4 días.'], [inRange < 4, 'Acércate a tu objetivo de calorías 4 días o más.']];
    const goal = (goals.find(g => g[0]) || [0, 'Mantén lo que haces y prueba una receta nueva.'])[1];
    return { t, logged: logged.length, avgK: avg('kcal'), avgP: avg('p'), avgF: avg('fib'), bad, waterOk, inRange, best, win, goal };
  }
  function sheetWeek() {
    const w = weekData();
    return { title: 'Tu semana', body: '<div class="stack"><div class="verdict good"><h3>' + esc(w.win) + '</h3></div>' +
      '<div class="grid2"><div class="stat"><span class="l">Días registrados</span><b class="big-n">' + w.logged + '/7</b></div><div class="stat"><span class="l">Media diaria</span><b class="big-n">' + fmt(w.avgK) + '</b><span class="small muted">kcal · objetivo ' + fmt(w.t.kcal) + '</span></div>' +
      '<div class="stat"><span class="l">Proteína media</span><b class="big-n">' + fmt(w.avgP) + ' g</b><span class="small muted">objetivo ' + fmt(w.t.p) + ' g</span></div><div class="stat"><span class="l">Fibra media</span><b class="big-n">' + fmt(w.avgF) + ' g</b><span class="small muted">objetivo ' + fmt(w.t.fib) + ' g</span></div>' +
      '<div class="stat"><span class="l">Días con malestar</span><b class="big-n">' + w.bad + '</b></div><div class="stat"><span class="l">Agua completa</span><b class="big-n">' + w.waterOk + '</b><span class="small muted">días</span></div></div>' +
      (w.best ? '<p class="small muted">Tu día más equilibrado en calorías: ' + esc(PV.fmtDay(w.best.k)) + '.</p>' : '') +
      '<div class="note"><span class="tag info">Objetivo</span><span>' + esc(w.goal) + '</span></div></div>' };
  }
  A.weekopen = () => U.openSheet('week');

  /* ---------- tutorial inicial ---------- */
  const TOUR = [
    ['📸', 'Añade comida como quieras', 'Busca un alimento, haz una foto, descríbelo con palabras o escanea una etiqueta. Te digo calorías, nutrientes, gluten, trazas y cómo suele sentar al colon.'],
    ['🔎', 'Descubre qué te sienta mal', 'Anota cómo te sientes después de comer. El Detective cruza tus comidas y tus molestias para encontrar patrones.'],
    ['🍳', 'Menús y recetas para ti', 'Haz el test de gustos, completa tu perfil y te propongo menús y recetas con airfryer, plancha y olla adaptadas a ti.']
  ];
  function sheetTour() {
    const i = U.sheet.i, t = TOUR[i];
    return { title: 'Bienvenido a Plato Vivo', body: '<div class="taste"><div class="big" aria-hidden="true">' + t[0] + '</div><h3>' + esc(t[1]) + '</h3><p class="muted">' + esc(t[2]) + '</p><div class="row" aria-hidden="true">' + TOUR.map((_, k) => '<span style="width:8px;height:8px;border-radius:50%;background:' + (k === i ? 'var(--accent)' : 'var(--line)') + '"></span>').join('') + '</div></div>',
      foot: '<div class="row"><button class="btn" data-act="tourend">Saltar</button><button class="btn primary grow" data-act="tournext">' + (i === TOUR.length - 1 ? 'Empezar' : 'Siguiente') + '</button></div>' };
  }
  A.tournext = () => { if (U.sheet.i >= TOUR.length - 1) A.tourend(); else { U.sheet.i++; U.renderSheet(); } };
  A.tourend = () => { PV.Store.mutate(s => { s.settings.tour = true; }); U.closeSheet(); };


  function sheetGate() {
    return { title: 'Antes de preparar tu menú', body: '<div class="taste"><div class="big" aria-hidden="true">🍽️</div><h3>Cuéntame qué te gusta</h3><p class="muted">Con un test de 2 minutos me dices qué alimentos te gustan, cuáles no comes y cuáles te sientan mal. Así tu menú sale a tu medida.</p></div>',
      foot: '<div class="stack"><button class="btn primary block" data-act="gatetest">Hacer el test ahora</button><button class="btn block" data-act="gateskip">Generar sin test</button></div>' };
  }
  A.gatetest = () => { U.closeSheet(); U.pl.sub = 'gus'; U.pl.ti = 0; U.render(); G.scrollTo(0, 0); };
  A.gateskip = () => { U.pl.skipGate = true; U.closeSheet(); A.pgen(); };

  /* hoja personalizada */
  U.VIEWS.__sheet = sh => (sh.type === 'recipe' ? sheetRecipe() : sh.type === 'shop' ? sheetShop() : sh.type === 'tour' ? sheetTour() : sh.type === 'gate' ? sheetGate() : sh.type === 'cook' ? sheetCook() : sh.type === 'week' ? sheetWeek() : { title: '', body: '' });

  (async function boot() {
    await PV.Store.init();
    U.ai = await PV.ai.ready();
    U.render();
    if (PV.free && PV.free.schedule) PV.free.schedule();
    if (!S().settings.tour) U.openSheet('tour', { i: 0 });
    setInterval(U.checkReminders, 60000);
    setTimeout(U.checkReminders, 8000);
  })();
})(globalThis);

</script>


</body>
</html>
